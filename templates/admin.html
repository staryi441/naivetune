<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaiveTune Web Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center border-b border-gray-800 pb-4 mb-6">
            <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500">
                NaiveTune Web Panel
            </h1>
            <span class="px-3 py-1 bg-green-500/10 text-green-400 rounded-full text-sm font-medium border border-green-500/20">
                Connected via SSH/Web
            </span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-1 bg-gray-900/50 p-4 rounded-xl border border-gray-800 flex flex-col justify-between h-[75vh]">
                <div>
                    <h2 class="text-lg font-bold mb-4 text-gray-300">Шаблоны сайтов</h2>
                    <div id="templates-list" class="space-y-2 overflow-y-auto max-h-[50vh]">
                        <p class="text-gray-500 text-sm animate-pulse">Анализ папки templates...</p>
                    </div>
                </div>
                
                <button id="apply-btn" disabled class="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-gray-800 disabled:text-gray-600 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200 cursor-pointer disabled:cursor-not-allowed">
                    Применить заглушку
                </button>
            </div>

            <div class="lg:col-span-3 flex flex-col bg-gray-900/50 rounded-xl border border-gray-800 overflow-hidden h-[75vh]">
                <div class="bg-gray-900 p-3 border-b border-gray-800 flex items-center justify-between">
                    <span class="text-sm font-mono text-gray-400" id="preview-url">Превью: выберите шаблон из списка</span>
                </div>
                <div class="flex-1 bg-white">
                    <iframe id="preview-frame" class="w-full h-full border-none" src="about:blank"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
    // Подтягиваем секретный путь, который Go передал в шаблон
    const WEB_PATH = "{{.CurrentWebPath}}";

    // Функция для сборки правильных URL-адресов
    function getApiUrl(endpoint) {
        // Убираем лишние слэши, чтобы путь не ломался
        const cleanBase = WEB_PATH.endsWith('/') ? WEB_PATH.slice(0, -1) : WEB_PATH;
        const cleanEndpoint = endpoint.startsWith('/') ? endpoint : '/' + endpoint;
        return `${cleanBase}${cleanEndpoint}`;
    }

    // 1. Загрузка шаблонов сайтов
    async function loadTemplates() {
        const templatesList = document.getElementById('templates-list');
        try {
            const response = await fetch(getApiUrl('/api/templates'));
            if (!response.ok) throw new Error('Ошибка сервера');
            
            const templates = await response.json();
            templatesList.innerHTML = '';

            if (!templates || templates.length === 0) {
                templatesList.innerHTML = '<div class="p-4 text-gray-400 text-center">Шаблоны не найдены</div>';
                return;
            }

            templates.forEach(tpl => {
                const div = document.createElement('div');
                div.className = 'p-3 mb-2 bg-slate-800 rounded cursor-pointer hover:bg-slate-700 transition select-none';
                div.innerText = tpl;
                div.onclick = () => selectTemplate(tpl);
                templatesList.appendChild(div);
            });
        } catch (error) {
            templatesList.innerHTML = '<div class="p-4 text-red-400 text-center">Ошибка загрузки шаблонов</div>';
        }
    }

    // 2. Выбор шаблона для превью
    function selectTemplate(name) {
        window.selectedTemplate = name;
        const previewFrame = document.getElementById('preview-frame');
        // Загружаем index.html выбранного шаблона через статический роут бэкенда
        previewFrame.src = getApiUrl(`/preview/${name}/index.html`);
    }

    // 3. Применение шаблона-заглушки
    async function applyTemplate() {
        if (!window.selectedTemplate) {
            alert('Сначала выберите шаблон из списка!');
            return;
        }

        try {
            const response = await fetch(getApiUrl('/api/templates/apply'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ template_name: window.selectedTemplate })
            });

            const data = await response.json();
            if (response.ok) {
                alert(data.message || 'Шаблон успешно применен!');
            } else {
                alert('Ошибка: ' + data.error);
            }
        } catch (error) {
            alert('Не удалось связаться с сервером.');
        }
    }

    // Вызываем загрузку при старте страницы
    document.addEventListener('DOMContentLoaded', () => {
        loadTemplates();
    });
</script>
</body>
</html>
